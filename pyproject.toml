[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
license = { text = "MIT" }
name = "sharpshape"
version = "1.0.0"
description = "RNA small-molecule binding pocket extraction and descriptors (RNA pocket atlas definitions)"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "biopython", "rnapolis==0.4.10"]

[project.scripts]
sharpshape = "sharpshape.cli:main"

[tool.setuptools]
packages = ["sharpshape"]
